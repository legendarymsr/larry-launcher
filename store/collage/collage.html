<!doctype html>
<!-- Collage for the README and X: the home screen in twelve themes (captures in raw/),
     two rows of six. Rendered by scripts/render-collage.sh at 1808x1350. -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1808px; height: 1350px; overflow: hidden; background: #0c0c12; }
  .grid { display: grid; grid-template-columns: repeat(6, 280px); gap: 16px; padding: 39px 24px; }
  .grid img { display: block; width: 280px; height: 628px; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
// The captured themes, mixed so light and look-alike themes aren't neighbors.
const THEMES = [
  'tokyo-night', 'kanagawa', 'matte-black', 'everforest', 'retro-82', 'osaka-jade',
  'gruvbox', 'ethereal', 'hackerman', 'ristretto', 'miasma', 'lumon',
];
document.getElementById('grid').innerHTML = THEMES.map(t => `<img src="raw/${t}.png" alt="${t}">`).join('');
</script>
</body>
</html>
